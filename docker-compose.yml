# docker-compose.yml - TradeSimple API 중심 아키텍처
# 
# 🔥 아키텍처:
#   [Streamlit UI] --HTTP--> [FastAPI API] ---> [LangGraph + LLM]
#
# API 서버: 모든 비즈니스 로직 (HS 코드 검색, 비용 계산, 보고서 생성)
# Web UI: 순수 프레젠테이션 레이어 (API 호출만)

version: '3.8'

services:
  # ===== FastAPI API 서버 (핵심 비즈니스 로직) =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradesimple-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-tradesimple}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # 데이터 (HS 코드 DB, 관세 DB)
      - ./data:/app/data:ro
      # 벡터스토어 (FAISS)
      - ./vector_store:/app/vector_store:ro
      # 한글 폰트
      - ./fonts:/app/fonts:ro
      # 보고서 출력 (공유 볼륨)
      - reports-data:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - tradesimple-network

  # ===== Streamlit Web UI (프레젠테이션 레이어) =====
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tradesimple-web
    ports:
      - "8501:8501"
    environment:
      # 🔥 API 서버 URL - 모든 요청은 API로 전달
      - API_BASE_URL=http://api:8000
    # 🔥 UI는 데이터/벡터스토어 불필요 (API가 처리)
    volumes:
      # 보고서 다운로드용 (공유 볼륨)
      - reports-data:/app/reports:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tradesimple-network

networks:
  tradesimple-network:
    driver: bridge

volumes:
  reports-data:
    driver: local
